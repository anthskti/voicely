# Voicely Render Blueprint
# Public:  voicely-api (Golang)
# Private: voicely-grader (Python)

services:
  - type: web
    name: voicely-api
    runtime: docker
    plan: starter
    region: ohio
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "8080"
      - key: GRADER_SERVICE_URL
        value: http://voicely-grader:10000/evaluate
      - key: DATABASE_URL
        sync: false
      - key: AWS_REGION
        value: us-east-2
      - key: AWS_S3_BUCKET
        value: voicely-proto-0821
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_PUBLIC_BASE_URL
        sync: false

  - type: pserv
    name: voicely-grader
    runtime: docker
    plan: starter
    region: ohio
    dockerfilePath: ./grader/Dockerfile
    dockerContext: ./grader
    envVars:
      - key: PORT
        value: "10000"
      - key: HOST
        value: "0.0.0.0"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
