# Voicely Render Blueprint
# Dashboard: New → Blueprint → connect this repo → apply render.yaml
#
# Public:  voicely-api  (Go)     → Bruno / Base44 hit this
# Private: voicely-grader (Python) → only reachable on Render's internal network
#
# Keep plans cheap for prototyping. Suspend services when idle.
# If the grader OOMs on Resemblyzer, bump grader only to `standard` (~$25).

services:
  - type: web
    name: voicely-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "8080"
      - key: GRADER_SERVICE_URL
        value: http://voicely-grader:10000/evaluate

  - type: pserv
    name: voicely-grader
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./grader/Dockerfile
    dockerContext: ./grader
    envVars:
      - key: PORT
        value: "10000"
      - key: HOST
        value: "0.0.0.0"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
