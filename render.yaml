# Voicely Render Blueprint
# Public:  voicely-api (Golang)
# Private: voicely-grader (Python)

services:
  - type: web
    name: voicely-api
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "8080"
      - key: GRADER_SERVICE_URL
        value: http://voicely-grader:10000/evaluate

  - type: pserv
    name: voicely-grader
    runtime: docker
    plan: starter
    region: ohio
    dockerfilePath: ./grader/Dockerfile
    dockerContext: ./grader
    envVars:
      - key: PORT
        value: "10000"
      - key: HOST
        value: "0.0.0.0"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
