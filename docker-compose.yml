# Local Phase 
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: voicely
      POSTGRES_PASSWORD: voicely
      POSTGRES_DB: voicely
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voicely -d voicely"]
      interval: 5s
      timeout: 5s
      retries: 5

  grader:
    build:
      context: ./grader
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      HOST: "0.0.0.0"
      ASSETS_ROOT: /assets
    volumes:
      - ./assets:/assets:ro
      - ./valorant:/valorant:ro

  api:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      GRADER_SERVICE_URL: http://grader:8000/evaluate
      DATABASE_URL: postgres://voicely:voicely@postgres:5432/voicely?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      grader:
        condition: service_started

volumes:
  postgres_data:
