# Local Phase 
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: voicely
      POSTGRES_PASSWORD: voicely
      POSTGRES_DB: voicely
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voicely -d voicely"]
      interval: 5s
      timeout: 5s
      retries: 5

  grader:
    build:
      context: ./grader
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      HOST: "0.0.0.0"
      ASSETS_ROOT: /assets
    volumes:
      - ./assets:/assets:ro
      - ./valorant:/valorant:ro

  api:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      PORT: "8080"
      GRADER_SERVICE_URL: http://grader:8000/evaluate
      DATABASE_URL: postgres://voicely:voicely@postgres:5432/voicely?sslmode=disable
      AWS_REGION: ${AWS_REGION:-us-east-2}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-voicely-proto-0821}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_S3_PUBLIC_BASE_URL: ${AWS_S3_PUBLIC_BASE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      grader:
        condition: service_started

volumes:
  postgres_data:
